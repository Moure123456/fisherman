<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لعبة صياد السمك الاحترافية</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; font-family: 'Cairo', Arial, sans-serif;
            background: #4fc3f7; touch-action: none;
        }
        #game-ui {
            position: absolute; top: 10px; left: 50%;
            transform: translateX(-50%); background: rgba(255, 255, 255, 0.95);
            padding: 6px 15px; border-radius: 20px; display: flex;
            gap: 12px; font-size: 14px; font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 10;
        }
        canvas { display: block; width: 100vw; height: 100vh; }
        
        /* أزرار التحكم السفلية المتقدمة */
        .control-panel {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 20;
            pointer-events: none;
        }
        .control-btn {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.9);
            border: 3px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: bold;
            color: #333;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            pointer-events: auto;
            cursor: pointer;
            text-align: center;
        }
        .control-btn:active { background: rgba(200, 200, 200, 0.9); transform: scale(0.95); }
        #btn-left { border-color: #0288d1; color: #0288d1; }
        #btn-right { border-color: #0288d1; color: #0288d1; }
        #btn-cast { border-color: #388e3c; color: #388e3c; }
        #btn-pull { border-color: #d32f2f; color: #d32f2f; }
        
        .group-btns { display: flex; gap: 10px; }
    </style>
</head>
<body>

    <div id="game-ui">
        <div>النقاط: <span id="score">0</span> pi</div>
        <div>المحفظة: <span id="wallet">0</span> pi</div>
        <div>الحالة: <span id="status">نهار ☀️</span></div>
    </div>

    <!-- أزرار التحكم السفلي -->
    <div class="control-panel">
        <div class="group-btns">
            <div id="btn-left" class="control-btn">◀️ يسار</div>
            <div id="btn-right" class="control-btn">يمين ▶️</div>
        </div>
        <div class="group-btns">
            <div id="btn-cast" class="control-btn">رمي 🎣</div>
            <div id="btn-pull" class="control-btn">سحب ⬆️</div>
        </div>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let score = 0;
        let wallet = 0;
        let isNight = false;

        const groundY = canvas.height * 0.7;
        const fishermanX = canvas.width * 0.15;
        const rodTipX = fishermanX + 20;
        const rodTipY = groundY - 65;

        let hookX = rodTipX;
        let hookY = rodTipY;
        let hookTargetX = rodTipX;
        let hookTargetY = rodTipY;
        let isCasting = false;
        let isPulling = false;
        let hookedFish = null;

        let movingLeft = false;
        let movingRight = false;

        // النجوم للوضع الليلي
        const stars = [];
        for(let i = 0; i < 40; i++) {
            stars.push({x: Math.random() * canvas.width, y: Math.random() * (groundY * 0.6), size: Math.random() * 2 + 1});
        }

        // المراكب المتحركة في الأعلى
        let boats = [
            { x: canvas.width * 0.5, speed: 0.5 },
            { x: canvas.width * 0.2, speed: 0.7 }
        ];

        // الأسماك تغطي حتى أعلى الشاشة
        let fishes = [];
        const fishTypes = [
            { name: 'حوت أبيض', val: 100, color: '#f5f5f5', size: 32, speed: 1.0 },
            { name: 'قرش أحمر', val: 50, color: '#e53935', size: 26, speed: 1.6 },
            { name: 'سمكة ملونة', val: 20, color: '#ffb300', size: 18, speed: 2.2 },
            { name: 'سمكة صغيرة', val: 10, color: '#43a047', size: 13, speed: 2.8 }
        ];

        function spawnFish() {
            if(fishes.length < 6) {
                let t = fishTypes[Math.floor(Math.random() * fishTypes.length)];
                fishes.push({
                    x: Math.random() > 0.5 ? -50 : canvas.width + 50,
                    y: 40 + Math.random() * (groundY - 120),
                    vx: (Math.random() > 0.5 ? 1 : -1) * t.speed,
                    ...t
                });
            }
        }
        setInterval(spawnFish, 1800);

        const setBtnEvent = (id, onStart, onEnd) => {
            const el = document.getElementById(id);
            el.addEventListener('touchstart', (e) => { onStart(); e.preventDefault(); });
            el.addEventListener('touchend', (e) => { if(onEnd) onEnd(); e.preventDefault(); });
            el.addEventListener('mousedown', () => { onStart(); });
            el.addEventListener('mouseup', () => { if(onEnd) onEnd(); });
        };

        setBtnEvent('btn-left', () => { movingLeft = true; }, () => { movingLeft = false; });
        setBtnEvent('btn-right', () => { movingRight = true; }, () => { movingRight = false; });
        setBtnEvent('btn-cast', () => { if(!hookedFish) { isCasting = true; isPulling = false; } });
        setBtnEvent('btn-pull', () => { isPulling = true; isCasting = false; });

        function loop() {
            if (movingLeft) hookTargetX -= 6;
            if (movingRight) hookTargetX += 6;
            hookTargetX = Math.max(50, Math.min(canvas.width - 50, hookTargetX));

            if (isCasting) {
                hookTargetY -= 12;
                if (hookTargetY <= 20) { hookTargetY = 20; isCasting = false; }
            } else if (isPulling) {
                hookTargetY += 12;
                if (hookTargetY >= rodTipY) {
                    hookTargetY = rodTipY;
                    hookTargetX = rodTipX;
                    isPulling = false;
                    if (hookedFish) {
                        score += hookedFish.val;
                        document.getElementById('score').innerText = score;
                        hookedFish = null;

                        if (score >= 200) {
                            wallet += score;
                            score = 0;
                            document.getElementById('wallet').innerText = wallet;
                            document.getElementById('score').innerText = score;
                            isNight = true;
                            document.getElementById('status').innerText = "ليل 🌙";
                        }
                    }
                }
            }

            hookX += (hookTargetX - hookX) * 0.2;
            hookY += (hookTargetY - hookY) * 0.2;

            if (hookedFish) {
                hookedFish.x = hookX + (Math.random() - 0.5) * 10;
                hookedFish.y = hookY + (Math.random() - 0.5) * 10;
            } else if (isCasting || isPulling || movingLeft || movingRight) {
                fishes.forEach((f, index) => {
                    if (Math.hypot(hookX - f.x, hookY - f.y) < 35) {
                        hookedFish = f;
                        fishes.splice(index, 1);
                    }
                });
            }

            boats.forEach(b => {
                b.x += b.speed;
                if (b.x > canvas.width + 100) b.x = -100;
            });

            if(!isNight) {
                ctx.fillStyle = '#4fc3f7'; ctx.fillRect(0, 0, canvas.width, groundY);
                ctx.fillStyle = '#0288d1'; ctx.fillRect(0, groundY * 0.25, canvas.width, groundY * 0.75);
            } else {
                ctx.fillStyle = '#0b132b'; ctx.fillRect(0, 0, canvas.width, groundY);
                ctx.fillStyle = '#1c2541'; ctx.fillRect(0, groundY * 0.25, canvas.width, groundY * 0.75);
                ctx.fillStyle = '#fff'; stars.forEach(s => ctx.fillRect(s.x, s.y, s.size, s.size));
                ctx.fillStyle = '#ffeb3b'; ctx.beginPath(); ctx.arc(canvas.width - 60, 50, 18, 0, Math.PI*2); ctx.fill();
            }

            boats.forEach(b => {
                ctx.fillStyle = isNight ? '#37474f' : '#6d4c41';
                ctx.beginPath();
                ctx.moveTo(b.x, groundY - 30);
                ctx.lineTo(b.x + 80, groundY - 30);
                ctx.lineTo(b.x + 65, groundY - 10);
                ctx.lineTo(b.x + 15, groundY - 10);
                ctx.fill();
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.moveTo(b.x + 40, groundY - 30);
                ctx.lineTo(b.x + 40, groundY - 60);
                ctx.lineTo(b.x + 65, groundY - 35);
                ctx.fill();
            });

            ctx.fillStyle = isNight ? '#3e2723' : '#ffecb3';
            ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);

            ctx.fillStyle = '#8d6e63'; ctx.fillRect(fishermanX + 20, groundY - 22, 22, 22);
            ctx.fillStyle = '#d7ccc8'; ctx.beginPath(); ctx.arc(fishermanX + 55, groundY - 12, 16, 0, Math.PI, false); ctx.fill();
            ctx.strokeStyle = '#4e342e'; ctx.lineWidth = 2; ctx.stroke();

            let fx = fishermanX, fy = groundY;
            ctx.fillStyle = '#3e2723'; ctx.fillRect(fx - 8, fy - 12, 7, 12); ctx.fillRect(fx + 3, fy - 12, 7, 12);
            ctx.fillStyle = '#1976d2'; ctx.fillRect(fx - 10, fy - 30, 22, 18);
            ctx.fillStyle = '#388e3c'; ctx.fillRect(fx - 12, fy - 62, 26, 32);
            ctx.fillStyle = '#ffccbc'; ctx.beginPath(); ctx.arc(fx, fy - 72, 10, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#d32f2f'; ctx.beginPath(); ctx.arc(fx, fy - 75, 10, Math.PI, Math.PI*2); ctx.fill();
            ctx.fillRect(fx, fy - 78, 14, 3);

            ctx.strokeStyle = '#333'; ctx.lineWidth = 2.5;
            ctx.beginPath(); ctx.moveTo(fx, fy - 45); ctx.lineTo(rodTipX, rodTipY); ctx.stroke();

            ctx.strokeStyle = isNight ? '#b0bec5' : '#333'; ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.moveTo(rodTipX, rodTipY); ctx.lineTo(hookX, hookY); ctx.stroke();
            
            ctx.fillStyle = '#78909c';
            ctx.beginPath(); ctx.arc(hookX, hookY, 4.5, 0, Math.PI*2); ctx.fill();

            fishes.forEach(f => {
                f.x += f.vx;
                if(f.x > canvas.width + 50) f.x = -40;
                if(f.x < -50) f.x = canvas.width + 40;

                ctx.save();
                ctx.translate(f.x, f.y);
                if(f.vx < 0) ctx.scale(-1, 1);
                ctx.fillStyle = f.color;
                ctx.beginPath(); ctx.ellipse(0, 0, f.size, f.size * 0.5, 0, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.moveTo(-f.size, 0); ctx.lineTo(-f.size - 10, -7); ctx.lineTo(-f.size - 10, 7); ctx.fill();
                ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(f.size * 0.4, -3, 2, 0, Math.PI*2); ctx.fill();
                ctx.restore();
            });

            if (hookedFish) {
                ctx.save();
                ctx.translate(hookedFish.x, hookedFish.y);
                ctx.rotate((Math.random() - 0.5) * 0.5);
                ctx.fillStyle = hookedFish.color;
                ctx.beginPath(); ctx.ellipse(0, 0, hookedFish.size, hookedFish.size * 0.5, 0, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.moveTo(-hookedFish.size, 0); ctx.lineTo(-hookedFish.size - 10, -7); ctx.lineTo(-hookedFish.size - 10, 7); ctx.fill();
                ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(hookedFish.size * 0.4, -3, 2, 0, Math.PI*2); ctx.fill();
                ctx.restore();
            }

            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
