<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة صياد السمك - Pi Fisherman</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: #1a1a1a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #gameContainer {
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 12px;
            overflow: hidden;
        }
        canvas {
            display: block;
            background: #87CEEB;
            cursor: pointer;
        }
        .ui-panel {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            background: rgba(0, 0, 0, 0.65);
            padding: 10px 25px;
            border-radius: 30px;
            color: #fff;
            font-weight: bold;
            font-size: 18px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border: 2px solid rgba(255,255,255,0.2);
            z-index: 10;
        }
        .badge {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .pi-icon {
            background: #f39c12;
            color: #fff;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
        }
        .instructions {
            position: absolute;
            bottom: 10px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="gameContainer">
        <div class="ui-panel">
            <div class="badge">
                الرصيد الحرفي: <span id="currentPi" style="color: #4cd137;">0</span> <span class="pi-icon">π</span>
            </div>
            <div style="border-left: 2px solid rgba(255,255,255,0.3);"></div>
            <div class="badge">
                المحفظة: <span id="walletPi" style="color: #fbc531;">0</span> <span class="pi-icon">π</span>
            </div>
        </div>
        <canvas id="gameCanvas" width="900" height="550"></canvas>
        <div class="instructions">اضغط أو انقر في الماء لرمي خيط السنارة واصطياد الأسماك!</div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // حالة اللعبة
        let currentPi = 0;
        let walletPi = 0;
        let isNight = false;

        // إعدادات خيط الصيد والسنارة
        const rodTip = { x: 215, y: 200 };
        let hook = {
            x: rodTip.x,
            y: rodTip.y,
            targetX: rodTip.x,
            targetY: rodTip.y,
            state: 'idle', // idle, casting, reeling, caught
            caughtFish: null,
            speed: 5
        };

        // المراكب
        const boats = [
            { x: 350, y: 205, speed: 0.6, length: 70, color: '#8B4513' },
            { x: 680, y: 190, speed: -0.4, length: 90, color: '#A0522D' }
        ];

        // النجوم للوضع الليلي
        const stars = [];
        for (let i = 0; i < 60; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * 180,
                radius: Math.random() * 1.5 + 0.5,
                alpha: Math.random()
            });
        }

        // أنواع الأسماك
        const FISH_TYPES = [
            { type: 'whale', name: 'حوت أبيض', color: '#FFFFFF', size: 38, reward: 100, speed: 1.2, rarity: 0.08 },
            { type: 'shark', name: 'قرش أحمر', color: '#E74C3C', size: 28, reward: 50, speed: 2.0, rarity: 0.22 },
            { type: 'normal', name: 'سمكة عادية', color: '#3498DB', size: 20, reward: 20, speed: 2.5, rarity: 0.45 },
            { type: 'small', name: 'سمكة صغيرة', color: '#F1C40F', size: 12, reward: 10, speed: 3.2, rarity: 1.00 }
        ];

        let fishes = [];

        function spawnFish() {
            if (fishes.length < 8 && Math.random() < 0.03) {
                const rand = Math.random();
                let selectedType = FISH_TYPES[3];
                for (let type of FISH_TYPES) {
                    if (rand <= type.rarity) {
                        selectedType = type;
                        break;
                    }
                }

                const dir = Math.random() < 0.5 ? 1 : -1;
                fishes.push({
                    ...selectedType,
                    x: dir === 1 ? -50 : canvas.width + 50,
                    y: 260 + Math.random() * 240,
                    dir: dir,
                    isHooked: false
                });
            }
        }

        // التحكم بالنقر / اللمس
        canvas.addEventListener("mousedown", handleInput);
        canvas.addEventListener("touchstart", (e) => {
            e.preventDefault();
            handleInput(e.touches[0]);
        });

        function handleInput(e) {
            if (hook.state !== 'idle') return;

            const rect = canvas.getBoundingClientRect();
            const clickX = (e.clientX - rect.left) * (canvas.width / rect.width);
            const clickY = (e.clientY - rect.top) * (canvas.height / rect.height);

            // الرمي في نطاق البحر فقط
            if (clickY > 230 && clickX > 200) {
                hook.targetX = clickX;
                hook.targetY = clickY;
                hook.state = 'casting';
            }
        }

        function addPi(amount) {
            currentPi += amount;
            if (currentPi >= 200) {
                walletPi += currentPi;
                currentPi = 0;
                isNight = true; // تفعيل الوضع الليلي
            }
            document.getElementById("currentPi").innerText = currentPi;
            document.getElementById("walletPi").innerText = walletPi;
        }

        // تحديث حركة العناصر
        function update() {
            // تحريك المراكب
            boats.forEach(boat => {
                boat.x += boat.speed;
                if (boat.x > canvas.width + 100) boat.x = -100;
                if (boat.x < -100) boat.x = canvas.width + 100;
            });

            // توليد وتحريك الأسماك
            spawnFish();
            fishes.forEach((fish, index) => {
                if (!fish.isHooked) {
                    fish.x += fish.speed * fish.dir;

                    // مسافة القرب من السنارة للالتقاط
                    if (hook.state === 'casting' || hook.state === 'reeling') {
                        const dist = Math.hypot(fish.x - hook.x, fish.y - hook.y);
                        if (dist < fish.size + 10) {
                            fish.isHooked = true;
                            hook.caughtFish = fish;
                            hook.state = 'reeling';
                        }
                    }
                } else {
                    // السمكة معلقة بالسنارة
                    fish.x = hook.x;
                    fish.y = hook.y + 10;
                }

                // حذف الأسماك الخارجة عن الشاشة
                if ((fish.dir === 1 && fish.x > canvas.width + 100) || 
                    (fish.dir === -1 && fish.x < -100)) {
                    fishes.splice(index, 1);
                }
            });

            // حركة السنارة والخيط
            if (hook.state === 'casting') {
                const dx = hook.targetX - hook.x;
                const dy = hook.targetY - hook.y;
                const dist = Math.hypot(dx, dy);

                if (dist < 5) {
                    hook.state = 'reeling';
                } else {
                    hook.x += (dx / dist) * hook.speed * 1.5;
                    hook.y += (dy / dist) * hook.speed * 1.5;
                }
            } else if (hook.state === 'reeling') {
                const dx = rodTip.x - hook.x;
                const dy = rodTip.y - hook.y;
                const dist = Math.hypot(dx, dy);

                if (dist < 10) {
                    if (hook.caughtFish) {
                        addPi(hook.caughtFish.reward);
                        // حذف السمكة التي تم اصطيادها
                        fishes = fishes.filter(f => f !== hook.caughtFish);
                        hook.caughtFish = null;
                    }
                    hook.x = rodTip.x;
                    hook.y = rodTip.y;
                    hook.state = 'idle';
                } else {
                    hook.x += (dx / dist) * hook.speed * 1.8;
                    hook.y += (dy / dist) * hook.speed * 1.8;
                }
            }
        }

        // رسم عناصر اللعبة
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. السماء
            if (isNight) {
                ctx.fillStyle = "#0a192f";
                ctx.fillRect(0, 0, canvas.width, 220);

                // النجوم
                stars.forEach(star => {
                    ctx.fillStyle = `rgba(255, 255, 255, ${Math.sin(Date.now() * 0.003 + star.x) * 0.3 + 0.7})`;
                    ctx.beginPath();
                    ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                    ctx.fill();
                });

                // القمر
                ctx.fillStyle = "#f5f6fa";
                ctx.beginPath();
                ctx.arc(750, 70, 30, 0, Math.PI * 2);
                ctx.fill();
            } else {
                ctx.fillStyle = "#74b9ff";
                ctx.fillRect(0, 0, canvas.width, 220);

                // الشمس
                ctx.fillStyle = "#f1c40f";
                ctx.beginPath();
                ctx.arc(750, 70, 35, 0, Math.PI * 2);
                ctx.fill();
            }

            // 2. المراكب في الخلفية
            boats.forEach(boat => {
                ctx.fillStyle = boat.color;
                ctx.beginPath();
                ctx.moveTo(boat.x, boat.y);
                ctx.lineTo(boat.x + boat.length, boat.y);
                ctx.lineTo(boat.x + boat.length - 15, boat.y + 18);
                ctx.lineTo(boat.x + 15, boat.y + 18);
                ctx.closePath();
                ctx.fill();

                // شراع المركب
                ctx.fillStyle = "#ffffff";
                ctx.beginPath();
                ctx.moveTo(boat.x + boat.length / 2, boat.y);
                ctx.lineTo(boat.x + boat.length / 2, boat.y - 30);
                ctx.lineTo(boat.x + boat.length / 2 + 20, boat.y - 10);
                ctx.closePath();
                ctx.fill();
            });

            // 3. البحر
            ctx.fillStyle = isNight ? "#1b4965" : "#0984e3";
            ctx.fillRect(0, 220, canvas.width, 330);

            // 4. الشاطئ
            ctx.fillStyle = "#ffeaa7";
            ctx.beginPath();
            ctx.moveTo(0, 210);
            ctx.lineTo(210, 230);
            ctx.lineTo(170, 550);
            ctx.lineTo(0, 550);
            ctx.closePath();
            ctx.fill();

            //
