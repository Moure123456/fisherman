<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لعبة صياد السمك الاحترافية للأندرويد</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; font-family: 'Cairo', Arial, sans-serif;
            background: #4fc3f7; touch-action: none;
        }
        #game-ui {
            position: absolute; top: 10px; left: 50%;
            transform: translateX(-50%); background: rgba(255, 255, 255, 0.95);
            padding: 8px 20px; border-radius: 20px; display: flex;
            gap: 20px; font-size: 16px; font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 10;
        }
        #tip {
            position: absolute; bottom: 10px; left: 50%;
            transform: translateX(-50%); background: rgba(0, 0, 0, 0.7);
            color: white; padding: 6px 15px; border-radius: 12px;
            font-size: 13px; z-index: 10; text-align: center;
        }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>

    <div id="game-ui">
        <div>النقاط: <span id="score">0</span> pi</div>
        <div>المحفظة: <span id="wallet">0</span> pi</div>
        <div>الحالة: <span id="status">نهار ☀️</span></div>
    </div>

    <div id="tip">اسحب بإصبعك لتحريك الصنارة، المس السمكة لتشبيكها ثم اسحبها للسلة!</div>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let score = 0;
        let wallet = 0;
        let isNight = false;

        // إحداثيات خطاف الصيد
        let hookX = canvas.width * 0.4;
        let hookY = canvas.height * 0.5;
        let hookedFish = null; // السمكة المشبوكة

        // إحداثيات الصياد والشاطئ
        const groundY = canvas.height * 0.68;
        const fishermanX = canvas.width * 0.15;

        // النجوم والقمر للوضع الليلي
        const stars = [];
        for(let i=0; i<35; i++) {
            stars.push({x: Math.random() * canvas.width, y: Math.random() * (groundY * 0.5), size: Math.random() * 2 + 1});
        }

        // الأسماك وأنواعها
        let fishes = [];
        const fishTypes = [
            { name: 'حوت أبيض', val: 100, color: '#f5f5f5', size: 35, speed: 1.5 },
            { name: 'قرش أحمر', val: 50, color: '#e53935', size: 28, speed: 2.2 },
            { name: 'سمكة ملونة', val: 20, color: '#ffb300', size: 20, speed: 2.8 },
            { name: 'سمكة صغيرة', val: 10, color: '#43a047', size: 14, speed: 3.5 }
        ];

        function spawnFish() {
            if(fishes.length < 5) {
                let t = fishTypes[Math.floor(Math.random() * fishTypes.length)];
                fishes.push({
                    x: Math.random() > 0.5 ? -50 : canvas.width + 50,
                    y: groundY * 0.15 + Math.random() * (groundY * 0.45),
                    vx: (Math.random() > 0.5 ? 1 : -1) * t.speed,
                    ...t
                });
            }
        }
        setInterval(spawnFish, 2000);

        // التحكم باللمس للأندرويد
        function updateTouch(x, y) {
            hookX = x;
            hookY = y;

            if(!hookedFish) {
                // محاولة تشبيك سمكة عند الاقتراب منها
                fishes.forEach(f => {
                    if(Math.hypot(hookX - f.x, hookY - f.y) < 45) {
                        hookedFish = f;
                    }
                });
            } else {
                // السمكة المشبوكة تتحرك مع الإصبع مع اهتزاز المقاومة (التملص)
                hookedFish.x = hookX + (Math.random() - 0.5) * 12;
                hookedFish.y = hookY + (Math.random() - 0.5) * 12;

                // التحقق من وصولها للسلة (بجوار الصياد)
                let basketX = fishermanX + 50;
                let basketY = groundY - 20;
                if(Math.hypot(hookX - basketX, hookY - basketY) < 55) {
                    score += hookedFish.val;
                    document.getElementById('score').innerText = score;

                    // إزالة السمكة
                    fishes = fishes.filter(f => f !== hookedFish);
                    hookedFish = null;

                    // التحقق من 200 pi والتحويل للمحفظة والوضع الليلي
                    if(score >= 200) {
                        wallet += score;
                        score = 0;
                        document.getElementById('wallet').innerText = wallet;
                        document.getElementById('score').innerText = score;
                        isNight = true;
                        document.getElementById('status').innerText = "ليل 🌙";
                    }
                }
            }
        }

        window.addEventListener('touchstart', (e) => { updateTouch(e.touches[0].clientX, e.touches[0].clientY); e.preventDefault(); }, {passive: false});
        window.addEventListener('touchmove', (e) => { updateTouch(e.touches[0].clientX, e.touches[0].clientY); e.preventDefault(); }, {passive: false});
        window.addEventListener('touchend', () => { 
            // إذا ترك اللاعب الإصبع ولم يضعها في السلة، تفلت السمكة
            if(hookedFish) { hookedFish = null; }
        });

        // دعم الماوس أيضاً للتجربة
        window.addEventListener('mousemove', (e) => { updateTouch(e.clientX, e.clientY); });

        // حلقة الرسم والتحديث
        function loop() {
            // خلفية البحر والسماء
            if(!isNight) {
                ctx.fillStyle = '#4fc3f7'; // السماء
                ctx.fillRect(0, 0, canvas.width, groundY);
                ctx.fillStyle = '#0288d1'; // البحر
                ctx.fillRect(0, groundY * 0.35, canvas.width, groundY * 0.65);
            } else {
                ctx.fillStyle = '#0b132b'; // السماء ليلاً
                ctx.fillRect(0, 0, canvas.width, groundY);
                ctx.fillStyle = '#1c2541'; // البحر ليلاً
                ctx.fillRect(0, groundY * 0.35, canvas.width, groundY * 0.65);

                // النجوم والقمر
                ctx.fillStyle = '#fff';
                stars.forEach(s => ctx.fillRect(s.x, s.y, s.size, s.size));
                ctx.fillStyle = '#ffeb3b';
                ctx.beginPath(); ctx.arc(canvas.width - 60, 60, 20, 0, Math.PI*2); ctx.fill();
            }

            // الشاطئ
            ctx.fillStyle = isNight ? '#3e2723' : '#ffecb3';
            ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);

            // المراكب في الخلفية
            ctx.fillStyle = isNight ? '#263238' : '#795548';
            ctx.beginPath();
            let bx = canvas.width * 0.65, by = groundY - 15;
            ctx.moveTo(bx, by); ctx.lineTo(bx + 90, by); ctx.lineTo(bx + 75, by + 20); ctx.lineTo(bx + 15, by + 20); ctx.fill();
            ctx.fillStyle = '#fff'; // الشراع
            ctx.beginPath(); ctx.moveTo(bx + 45, by); ctx.lineTo(bx + 45, by - 35); ctx.lineTo(bx + 70, by); ctx.fill();

            // كرسي الصياد والسلة
            ctx.fillStyle = '#8d6e63';
            ctx.fillRect(fishermanX + 20, groundY - 22, 22, 22); // الكرسي
            ctx.fillStyle = '#d7ccc8'; // السلة
            ctx.beginPath(); ctx.arc(fishermanX + 55, groundY - 12, 16, 0, Math.PI, false); ctx.fill();
            ctx.strokeStyle = '#4e342e'; ctx.lineWidth = 2; ctx.stroke();

            // رسم الصياد (بشكل بشري واضح جداً بملابسه المطلوبة)
            let fx = fishermanX, fy = groundY;
            // الحذاء والرجلين
            ctx.fillStyle = '#3e2723';
            ctx.fillRect(fx - 8, fy - 12, 7, 12);
            ctx.fillRect(fx + 3, fy - 12, 7, 12);
            // الشورت الأزرق
            ctx.fillStyle = '#1976d2';
            ctx.fillRect(fx - 10, fy - 30, 22, 18);
            // الصديري الأخضر
            ctx.fillStyle = '#388e3c';
            ctx.fillRect(fx - 12, fy - 62, 26, 32);
            // الرأس
            ctx.fillStyle = '#ffccbc';
            ctx.beginPath(); ctx.arc(fx, fy - 72, 10, 0, Math.PI*2); ctx.fill();
            // الكاب الأحمر
            ctx.fillStyle = '#d32f2f';
            ctx.beginPath(); ctx.arc(fx, fy - 75, 10, Math.PI, Math.PI*2); ctx.fill();
            ctx.fillRect(fx, fy - 78, 14, 3); // حافة الكاب

            // صنارة الخيط
            let rodTipX = fx + 20, rodTipY = fy - 65;
            ctx.strokeStyle = '#333'; ctx.lineWidth = 2.5;
            ctx.beginPath(); ctx.moveTo(fx, fy - 45); ctx.lineTo(rodTipX, rodTipY); ctx.stroke();

            // الخيط المتجه للخطاف
            ctx.strokeStyle = isNight ? '#b0bec5' : '#444'; ctx.lineWidth = 1.2;
            ctx.beginPath(); ctx.moveTo(rodTipX, rodTipY); ctx.lineTo(hookX, hookY); ctx.stroke();
            
            // الخطاف
            ctx.fillStyle = '#78909c';
            ctx.beginPath(); ctx.arc(hookX, hookY, 4, 0, Math.PI*2); ctx.fill();

            // تحريك ورسم الأسماك
            fishes.forEach(f => {
                if(f !== hookedFish) {
                    f.x += f.vx;
                    if(f.x > canvas.width + 50) f.x = -40;
                    if(f.x < -50) f.x = canvas.width + 40;
                }

                ctx.save();
                ctx.translate(f.x, f.y);
                if(f.vx < 0) ctx.scale(-1, 1);

                // جسم السمكة
                ctx.fillStyle = f.color;
                ctx.beginPath(); ctx.ellipse(0, 0, f.size, f.size * 0.5, 0, 0, Math.PI*2); ctx.fill();
                // الذيل
                ctx.beginPath(); ctx.moveTo(-f.size, 0); ctx.lineTo(-f.size - 12, -8); ctx.lineTo(-f.size - 12, 8); ctx.fill();
                // العين
                ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(f.size * 0.4, -3, 2.5, 0, Math.PI*2); ctx.fill();

                ctx.restore();
            });

            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
