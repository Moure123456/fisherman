<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة صياد السمك 3D - وضع الصيد التفاعلي</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Cairo', Arial, sans-serif;
            background: #000;
        }
        #ui-bar {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 25px;
            border-radius: 12px;
            display: flex;
            gap: 25px;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 10;
            direction: rtl;
        }
        .night-ui {
            background: rgba(20, 20, 35, 0.9) !important;
            color: #fff !important;
        }
        #instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 10;
            text-align: center;
        }
    </style>
    <!-- استدعاء مكتبة Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui-bar">
        <div>النقاط: <span id="score">0</span> pi</div>
        <div>المحفظة: <span id="wallet">0</span> pi</div>
        <div>الحالة: <span id="status">الوضع النهارى</span></div>
    </div>

    <div id="instructions">حرك الماوس لتوجيه الصنارة، انقر فوق السمكة لتشبيكها ثم اسحبها وضعها في السلة!</div>

    <script>
        // إعداد المشهد والكاميرا والمحرك
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 4, 14);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // الإضاءة
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // شاطئ البحر
        const beachGeometry = new THREE.PlaneGeometry(60, 20);
        const beachMaterial = new THREE.MeshLambertMaterial({ color: 0xF4A460 });
        const beach = new THREE.Mesh(beachGeometry, beachMaterial);
        beach.rotation.x = -Math.PI / 2;
        beach.position.set(0, -2, 5);
        scene.add(beach);

        // البحر
        const seaGeometry = new THREE.PlaneGeometry(60, 30);
        const seaMaterial = new THREE.MeshLambertMaterial({ color: 0x0083b0 });
        const sea = new THREE.Mesh(seaGeometry, seaMaterial);
        sea.rotation.x = -Math.PI / 2;
        sea.position.set(0, -2.1, -5);
        scene.add(sea);

        // بناء الصياد (شورت، صُديري، كاب)
        const fishermanGroup = new THREE.Group();

        // الصديري (أخضر غامق)
        const vestMesh = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.8, 0.8), new THREE.MeshLambertMaterial({ color: 0x2e6f40 }));
        vestMesh.position.set(-3, 0.5, 2);
        fishermanGroup.add(vestMesh);

        // الشورت (أزرق داكن)
        const shortsMesh = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.9, 0.8), new THREE.MeshLambertMaterial({ color: 0x000080 }));
        shortsMesh.position.set(-3, -0.5, 2);
        fishermanGroup.add(shortsMesh);

        // الرأس
        const headMesh = new THREE.Mesh(new THREE.SphereGeometry(0.5, 16, 16), new THREE.MeshLambertMaterial({ color: 0xffcc99 }));
        headMesh.position.set(-3, 1.7, 2);
        fishermanGroup.add(headMesh);

        // الكاب (أحمر)
        const capMesh = new THREE.Mesh(new THREE.ConeGeometry(0.55, 0.4, 16), new THREE.MeshLambertMaterial({ color: 0xcc0000 }));
        capMesh.position.set(-3, 2.1, 2);
        fishermanGroup.add(capMesh);

        scene.add(fishermanGroup);

        // الكرسي والسلة
        const chairMesh = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshLambertMaterial({ color: 0xA0522D }));
        chairMesh.position.set(-1.8, -0.5, 2);
        scene.add(chairMesh);

        const basketMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.4, 0.9, 16), new THREE.MeshLambertMaterial({ color: 0xDEB887 }));
        basketMesh.position.set(-1.8, -0.5, 3.2);
        scene.add(basketMesh);

        // المراكب في الخلفية
        const boat = new THREE.Mesh(new THREE.BoxGeometry(3, 0.8, 1.5), new THREE.MeshLambertMaterial({ color: 0x8B4513 }));
        boat.position.set(5, -1.5, -6);
        scene.add(boat);

        // إنشاء خيط الصيد (Line ثلاثي الأبعاد)
        const rodTipPos = new THREE.Vector3(-2.5, 2.2, 2); // طرف الصنارة عند الصياد
        const lineGeo = new THREE.BufferGeometry().setFromPoints([rodTipPos, rodTipPos]);
        const lineMat = new THREE.LineBasicMaterial({ color: 0xffffff, linewidth: 2 });
        const fishingLine = new THREE.Line(lineGeo, lineMat);
        scene.add(fishingLine);

        // مصفوفة الأسماك
        let fishes = [];
        const fishTypes = [
            { name: 'حوت أبيض', value: 100, color: 0xf0f0f0, size: 1.3, speed: 0.025 },
            { name: 'قرش أحمر', value: 50, color: 0xff4d4d, size: 1.0, speed: 0.035 },
            { name: 'سمكة عادية', value: 20, color: 0xff9900, size: 0.7, speed: 0.045 },
            { name: 'سمكة صغيرة', value: 10, color: 0x33cc33, size: 0.45, speed: 0.055 }
        ];

        function spawnFish() {
            if (fishes.length < 6) {
                let template = fishTypes[Math.floor(Math.random() * fishTypes.length)];
                const geom = new THREE.ConeGeometry(template.size * 0.5, template.size * 1.5, 8);
                geom.rotateX(Math.PI / 2);
                const mat = new THREE.MeshLambertMaterial({ color: template.color });
                const fishMesh = new THREE.Mesh(geom, mat);

                fishMesh.position.set((Math.random() - 0.5) * 12, -1 + Math.random() * 2, -2 - Math.random() * 6);
                scene.add(fishMesh);

                fishes.push({
                    mesh: fishMesh,
                    value: template.value,
                    speed: template.speed * (Math.random() > 0.5 ? 1 : -1),
                    isHooked: false
                });
            }
        }
        setInterval(spawnFish, 2500);

        // تفاعل الماوس وتحريك خطاف الصيد
        let hookPos = new THREE.Vector3(0, 0, 0);
        let hookedFish = null; // السمكة المشبوكة حالياً

        window.addEventListener('mousemove', (e) => {
            // تحويل إحداثيات الماوس إلى الفضاء الثلاثي الأبعاد داخل البحر
            let mouseX = (e.clientX / window.innerWidth) * 2 - 1;
            let mouseY = -(e.clientY / window.innerHeight) * 2 + 1;

            hookPos.x = mouseX * 7;
            hookPos.y = mouseY * 3;
            hookPos.z = -3;

            // إذا كانت هناك سمكة مشبوكة، تتحرك مع الخيط مع اهتزاز (تملص)
            if (hookedFish) {
                let wiggle = (Math.random() - 0.5) * 0.4;
                hookedFish.mesh.position.set(hookPos.x + wiggle, hookPos.y + wiggle, hookPos.z);
            }
        });

        // النقر لتشبيك السمكة أو إلقائها في السلة
        window.addEventListener('click', (e) => {
            if (!hookedFish) {
                // البحث عن سمكة قريبة لتشبيكها بالصنارة
                fishes.forEach(f => {
                    let dist = f.mesh.position.distanceTo(hookPos);
                    if (dist < 2.0) {
                        hookedFish = f;
                        f.isHooked = true;
                    }
                });
            } else {
                // إذا كانت مشبوكة، وعند النقر بالقرب من السلة، يتم وضعها فيها!
                let basketPos = new THREE.Vector3(-1.8, -0.5, 3.2);
                let distToBasket = hookPos.distanceTo(basketPos);

                // سحبها وإضافتها للرصيد أينما تم سحبها للشاطئ أو السلة
                let scoreElem = document.getElementById('score');
                let walletElem = document.getElementById('wallet');

                let currentScore = parseInt(scoreElem.innerText) + hookedFish.value;
                scoreElem.innerText = currentScore;

                // إزالة السمكة المشبوكة من المشهد
                scene.remove(hookedFish.mesh);
                fishes = fishes.filter(f => f !== hookedFish);
                hookedFish = null;

                // نظام التحويل للمحفظة والوضع الليلي عند 200 pi
                if (currentScore >= 200) {
                    let currentWallet = parseInt(walletElem.innerText) + currentScore;
                    walletElem.innerText = currentWallet;
                    scoreElem.innerText = 0;

                    // تفعيل الوضع الليلي والنجوم
                    scene.background = new THREE.Color(0x050515);
                    sea.material.color.setHex(0x102030);
                    dirLight.color.setHex(0x4444aa);
                    document.getElementById('ui-bar').classList.add('night-ui');
                    document.getElementById('status').innerText = "الوضع الليلي نشط 🌙";
                }
            }
        });

        let score = 0;
        let wallet = 0;

        // حلقة اللعبة والتحديث المستمر
        function animate() {
            requestAnimationFrame(animate);

            // تحريك الأسماك غير المشبوكة
            fishes.forEach(f => {
                if (!f.isHooked) {
                    f.mesh.position.x += f.speed;
                    if (f.mesh.position.x > 8 || f.mesh.position.x < -8) {
                        f.speed *= -1;
                        f.mesh.rotation.y += Math.PI;
                    }
                }
            });

            // تحديث رسم خط الصيد (من طرف الصنارة إلى موقع الخطاف/الماوس)
            const positions = fishingLine.geometry.attributes.position.array;
            positions[0] = rodTipPos.x;
            positions[1] = rodTipPos.y;
            positions[2] = rodTipPos.z;

            positions[3] = hookPos.x;
            positions[4] = hookPos.y;
            positions[5] = hookPos.z;
            fishingLine.geometry.attributes.position.needsUpdate = true;

            renderer.render(scene, camera);
        }

        animate();

        // التجاوب مع تغيير حجم الشاشة
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
